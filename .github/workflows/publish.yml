name: Publish to npm

# Publie sur npm à chaque push sur main dont la version de package.json n'est pas encore sur le
# registre. Un push qui ne change pas la version lance donc les tests et s'arrête là.
#
# Authentification par « Trusted Publishing » (OIDC) : aucun jeton npm n'est stocké dans ce dépôt.
# Réglage à faire une fois sur npmjs.com, dans les paramètres du paquet → Trusted Publisher →
# GitHub Actions : organisation/utilisateur CaptnOliv, dépôt signalk-ac42-autopilot,
# fichier de workflow publish.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tests
        run: npm test

      - name: Version déjà publiée ?
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version est déjà sur npm : rien à publier."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version n'est pas sur npm : publication."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Le Trusted Publishing demande npm 11.5.1 ou plus récent.
      - name: npm à jour
        if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@latest

      - name: Publication
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
